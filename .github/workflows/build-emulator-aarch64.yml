# 交叉编译 Linux aarch64 Android Emulator
# Actions → Build Emulator aarch64 → Run workflow
# 产物：artifact「emulator-linux-aarch64」→ emulator-linux-aarch64.zip
#
# 关键点：maximize 会把 / 压到 root-reserve；apt/pip/git 默认写 / 与 /tmp。
# 必须：root-reserve 足够大 + TMPDIR/XDG_CACHE 指到大盘工作区。

name: Build Emulator aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          # / 上要留给 apt、pip、/tmp；太小会出现「工作区还有 99G 但 sync 秒挂」
          root-reserve-mb: 20480
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Free disk + redirect temp to big volume
        run: |
          set -eux
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            /usr/share/gradle \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /usr/local/lib/node_modules \
            /var/lib/docker \
            /var/cache/apt/archives \
            "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean || true
          sudo docker system prune -af || true

          WS="${{ github.workspace }}"
          mkdir -p "$WS/.tmp" "$WS/.cache" "$WS/.ccache"
          # 后续步骤全部走大盘，避免写爆只剩十几 G 的 /
          {
            echo "TMPDIR=$WS/.tmp"
            echo "TEMP=$WS/.tmp"
            echo "TMP=$WS/.tmp"
            echo "XDG_CACHE_HOME=$WS/.cache"
            echo "CCACHE_DIR=$WS/.ccache"
          } >> "$GITHUB_ENV"

          echo "=== mounts ==="
          df -h / /tmp /home /mnt "$WS" || true

      - name: Install deps
        run: |
          set -eux
          df -h / /tmp "${{ github.workspace }}" || true
          sudo apt-get update
          sudo apt-get install -y \
            python3 python-is-python3 python3-pip \
            crossbuild-essential-arm64 mesa-common-dev \
            ccache git llvm ninja-build cmake wget curl zip unzip
          mkdir -p "${{ github.workspace }}/.tmp"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            > "${{ github.workspace }}/.tmp/repo"
          sudo install -m 0755 "${{ github.workspace }}/.tmp/repo" /usr/local/bin/repo
          pip3 install --user absl-py urlfetch
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ccache -o max_size=2G
          ccache -o hard_link=true
          repo --version
          python3 --version
          df -h / /tmp "${{ github.workspace }}" || true

      - name: Configure git
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "emulator-builder"
          git config --global color.ui false
          # 降低偶发 HTTP/2 断流
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      - name: repo sync emu-master-dev
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          WS="${{ github.workspace }}"
          export REPO_TRACE=0
          export TMPDIR="$WS/.tmp"
          export TMP="$TMPDIR"
          export TEMP="$TMPDIR"
          export XDG_CACHE_HOME="$WS/.cache"
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" emu

          echo "=== disk before sync ==="
          df -h / /tmp /home "$WS" || true
          free -h || true

          # 探测 googlesource（失败也能从日志看清是网络问题）
          curl -fsSIL --max-time 30 \
            https://android.googlesource.com/platform/manifest \
            | head -n 20 || echo "WARN: manifest HEAD probe failed"

          cd emu
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

          repo init -u https://android.googlesource.com/platform/manifest \
            -b emu-master-dev --depth=1

          set +e
          rc=1
          for i in 1 2 3; do
            echo "=== repo sync try $i ==="
            df -h / /tmp "$WS" || true
            rm -f .repo/TRACE .repo/TRACE* 2>/dev/null || true
            SYNC_LOG="$WS/.tmp/repo-sync-$i.log"
            # 对齐官方/LSPosed：-c + 适度并行；tee 保证 Actions 日志可见
            # 不要只重定向到文件（上次失败日志只有 980B，底栏又没 cat）
            repo sync -c -j4 --no-tags 2>&1 | tee "$SYNC_LOG"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "repo sync OK"
              break
            fi
            echo "sync failed rc=$rc"
            echo "===== FULL SYNC LOG BEGIN ====="
            cat "$SYNC_LOG" || true
            echo "===== FULL SYNC LOG END ====="
            echo "=== disk after fail ==="
            df -h / /tmp /home "$WS" || true
            du -sh .repo 2>/dev/null || true
            sleep 15
          done
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "repo sync ultimately failed"
            echo "===== LAST LOG ====="
            cat "$WS/.tmp"/repo-sync-*.log || true
            df -h / /tmp /home "$WS" || true
            exit "$rc"
          fi

          echo "EMU_SRC=$WS/emu" >> "$GITHUB_ENV"
          df -h / "$WS"
          du -sh . | tail -1

      - name: Drop unused trees to save disk
        working-directory: ${{ github.workspace }}/emu
        run: |
          set -eux
          rm -rf .repo
          rm -rf \
            external/qemu/android/docs \
            external/qemu/tests \
            prebuilts/android-emulator-build/archive \
            || true
          df -h
          du -sh . 2>/dev/null | tail -1 || true

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: emu-aarch64-ccache-${{ github.run_id }}
          restore-keys: |
            emu-aarch64-ccache-

      - name: Patch known build breaks
        working-directory: ${{ github.workspace }}/emu
        run: |
          set -eux
          f1=external/google-breakpad/src/client/linux/handler/exception_handler.cc
          if [ -f "$f1" ]; then
            sed -i 's/kSigStackSize = std::max(/kSigStackSize = std::max<unsigned>(/g' "$f1" || true
          fi
          f2=external/qemu/android/third_party/crashpad/client/crashpad_client_linux_test.cc
          if [ -f "$f2" ]; then
            sed -i 's/constexpr size_t stack_size = MINSIGSTKSZ/static size_t stack_size = MINSIGSTKSZ/g' "$f2" || true
          fi

      - name: Patch Snapshotter.cpp missing thread header
        working-directory: ${{ github.workspace }}/emu
        run: |
          set -euo pipefail
          f="external/qemu/android/android-emu/android/snapshot/Snapshotter.cpp"
          test -f "$f"
          if ! grep -q '#include <thread>' "$f"; then
            sed -i '0,/#include/{s|#include|#include <thread>\n#include <chrono>\n#include|}' "$f"
          fi
          grep -n 'thread\|chrono\|sleep_for' "$f" | head -20

      - name: Build linux_aarch64
        working-directory: ${{ github.workspace }}/emu/external/qemu
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          export NINJA_STATUS="[%f/%t %es] "
          df -h
          free -h || true
          ccache -z
          python3 android/build/python/cmake.py \
            --noqtwebengine \
            --noshowprefixforinfo \
            --target linux_aarch64 \
            --config release \
            --strip \
            --ccache auto \
            --minbuild \
            --no-tests
          ccache -s
          df -h
          free -h || true
          ls -lh objs/distribution/emulator | head
          test -f objs/distribution/emulator/source.properties
          cat objs/distribution/emulator/source.properties
          find objs/distribution/emulator/qemu -name 'qemu-system-aarch64*' -type f | head
          file objs/distribution/emulator/qemu/linux-aarch64/qemu-system-aarch64* | head || true

      - name: Strip ELF (optional)
        working-directory: ${{ github.workspace }}/emu/external/qemu
        run: |
          set -eux
          find objs/distribution/emulator -type f -print0 \
            | xargs -0 -I{} sh -c 'file "$1" | grep -qi "ELF" && llvm-strip --strip-all "$1" || true' _ {}

      - name: Clean build trees before zip
        working-directory: ${{ github.workspace }}/emu/external/qemu
        run: |
          set -eux
          find objs -mindepth 1 -maxdepth 1 ! -name distribution -exec rm -rf {} +
          rm -rf "${{ github.workspace }}/emu/external/grpc" || true
          rm -rf "${{ github.workspace }}/.ccache" || true
          df -h

      - name: Pack zip
        working-directory: ${{ github.workspace }}/emu/external/qemu/objs/distribution
        run: |
          set -eux
          zip -r "$GITHUB_WORKSPACE/emulator-linux-aarch64.zip" emulator
          ls -lh "$GITHUB_WORKSPACE/emulator-linux-aarch64.zip"
          python3 - <<'PY'
          import os
          n = os.path.getsize(os.environ["GITHUB_WORKSPACE"] + "/emulator-linux-aarch64.zip")
          print("zip_bytes", n)
          assert n > 50_000_000, "zip too small, build incomplete"
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-linux-aarch64
          path: emulator-linux-aarch64.zip
          retention-days: 14
          if-no-files-found: error
