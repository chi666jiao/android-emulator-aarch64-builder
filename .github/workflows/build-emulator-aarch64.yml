# 交叉编译 Linux aarch64 Android Emulator
# Actions → Build Emulator aarch64 → Run workflow
# 产物：artifact「emulator-linux-aarch64」→ emulator-linux-aarch64.zip
#
# 已修问题：
# 1) 根盘预留太小 → apt/pip/tmp 写爆（工作区仍空）
# 2) TMPDIR 落在超长 GITHUB_WORKSPACE → repo AF_UNIX path too long
#    解法：大盘 bind 到短路径 /e，全程 TMPDIR=/e/t、源码在 /e/emu

name: Build Emulator aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Free disk + bind workspace to /e
        run: |
          set -eux
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            /usr/share/gradle \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /usr/local/lib/node_modules \
            /var/lib/docker \
            /var/cache/apt/archives \
            "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean || true
          sudo docker system prune -af || true

          WS="${{ github.workspace }}"
          sudo mkdir -p /e
          if ! findmnt -n /e >/dev/null 2>&1; then
            sudo mount --bind "$WS" /e
          fi
          sudo chown -R "$(id -u):$(id -g)" /e
          mkdir -p /e/t /e/c /e/cc /e/emu

          {
            echo "EMU_ROOT=/e"
            echo "EMU_SRC=/e/emu"
            echo "TMPDIR=/e/t"
            echo "TEMP=/e/t"
            echo "TMP=/e/t"
            echo "XDG_CACHE_HOME=/e/c"
            echo "CCACHE_DIR=/e/cc"
          } >> "$GITHUB_ENV"

          df -h / /tmp /home /mnt "$WS" /e || true
          python3 -c "import os; print('path_lens', len('/e/t'), len(r'''$WS'''.strip() or 'x'))"

      - name: Install deps
        run: |
          set -eux
          df -h / /tmp /e || true
          sudo apt-get update
          sudo apt-get install -y \
            python3 python-is-python3 python3-pip \
            crossbuild-essential-arm64 mesa-common-dev \
            ccache git llvm ninja-build cmake wget curl zip unzip
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /e/t/repo
          sudo install -m 0755 /e/t/repo /usr/local/bin/repo
          pip3 install --user absl-py urlfetch
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ccache -o max_size=2G
          ccache -o hard_link=true
          repo --version
          python3 --version
          df -h / /tmp /e || true

      - name: Configure git
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "emulator-builder"
          git config --global color.ui false
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      - name: repo sync emu-master-dev
        run: |
          set -eux
          export REPO_TRACE=0
          export TMPDIR=/e/t TEMP=/e/t TMP=/e/t
          export XDG_CACHE_HOME=/e/c
          mkdir -p /e/t /e/c /e/emu

          echo "=== disk / tempfile check ==="
          df -h / /tmp /home /e || true
          free -h || true
          python3 - <<'PY'
          import os, tempfile
          td = tempfile.gettempdir()
          print("TMPDIR", os.environ.get("TMPDIR"))
          print("gettempdir", td, "len", len(td))
          assert len(td) < 80, "temp path still too long for AF_UNIX"
          PY

          curl -fsSIL --max-time 30 \
            https://android.googlesource.com/platform/manifest \
            | head -n 20 || echo "WARN: manifest HEAD probe failed"

          cd /e/emu
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

          repo init -u https://android.googlesource.com/platform/manifest \
            -b emu-master-dev --depth=1

          set +e
          rc=1
          for i in 1 2 3; do
            echo "=== repo sync try $i ==="
            df -h / /tmp /e || true
            rm -f .repo/TRACE .repo/TRACE* 2>/dev/null || true
            SYNC_LOG="/e/t/repo-sync-$i.log"
            repo sync -c -j4 --no-tags 2>&1 | tee "$SYNC_LOG"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "repo sync OK"
              break
            fi
            echo "sync failed rc=$rc"
            echo "===== FULL SYNC LOG BEGIN ====="
            cat "$SYNC_LOG" || true
            echo "===== FULL SYNC LOG END ====="
            df -h / /tmp /home /e || true
            du -sh .repo 2>/dev/null || true
            # AF_UNIX 类错误重试无意义
            if grep -q 'AF_UNIX path too long' "$SYNC_LOG" 2>/dev/null; then
              echo "FATAL: AF_UNIX path too long — TMPDIR must stay short (/e/t)"
              break
            fi
            sleep 15
          done
          set -e

          if [ "$rc" -ne 0 ]; then
            cat /e/t/repo-sync-*.log || true
            df -h / /tmp /home /e || true
            exit "$rc"
          fi

          df -h / /e
          du -sh . | tail -1

      - name: Drop unused trees to save disk
        working-directory: /e/emu
        run: |
          set -eux
          rm -rf .repo
          rm -rf \
            external/qemu/android/docs \
            external/qemu/tests \
            prebuilts/android-emulator-build/archive \
            || true
          df -h /e
          du -sh . 2>/dev/null | tail -1 || true

      - name: ccache
        uses: actions/cache@v4
        with:
          path: /e/cc
          key: emu-aarch64-ccache-${{ github.run_id }}
          restore-keys: |
            emu-aarch64-ccache-

      - name: Patch known build breaks
        working-directory: /e/emu
        run: |
          set -eux
          f1=external/google-breakpad/src/client/linux/handler/exception_handler.cc
          if [ -f "$f1" ]; then
            sed -i 's/kSigStackSize = std::max(/kSigStackSize = std::max<unsigned>(/g' "$f1" || true
          fi
          f2=external/qemu/android/third_party/crashpad/client/crashpad_client_linux_test.cc
          if [ -f "$f2" ]; then
            sed -i 's/constexpr size_t stack_size = MINSIGSTKSZ/static size_t stack_size = MINSIGSTKSZ/g' "$f2" || true
          fi

      - name: Patch Snapshotter.cpp missing thread header
        working-directory: /e/emu
        run: |
          set -euo pipefail
          f="external/qemu/android/android-emu/android/snapshot/Snapshotter.cpp"
          test -f "$f"
          if ! grep -q '#include <thread>' "$f"; then
            sed -i '0,/#include/{s|#include|#include <thread>\n#include <chrono>\n#include|}' "$f"
          fi
          grep -n 'thread\|chrono\|sleep_for' "$f" | head -20

      - name: Build linux_aarch64
        working-directory: /e/emu/external/qemu
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          export TMPDIR=/e/t TEMP=/e/t TMP=/e/t
          export CCACHE_DIR=/e/cc
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          export NINJA_STATUS="[%f/%t %es] "
          df -h / /e
          free -h || true
          ccache -z
          python3 android/build/python/cmake.py \
            --noqtwebengine \
            --noshowprefixforinfo \
            --target linux_aarch64 \
            --config release \
            --strip \
            --ccache auto \
            --minbuild \
            --no-tests
          ccache -s
          df -h / /e
          free -h || true
          ls -lh objs/distribution/emulator | head
          test -f objs/distribution/emulator/source.properties
          cat objs/distribution/emulator/source.properties
          find objs/distribution/emulator/qemu -name 'qemu-system-aarch64*' -type f | head
          file objs/distribution/emulator/qemu/linux-aarch64/qemu-system-aarch64* | head || true

      - name: Strip ELF (optional)
        working-directory: /e/emu/external/qemu
        run: |
          set -eux
          find objs/distribution/emulator -type f -print0 \
            | xargs -0 -I{} sh -c 'file "$1" | grep -qi "ELF" && llvm-strip --strip-all "$1" || true' _ {}

      - name: Clean build trees before zip
        working-directory: /e/emu/external/qemu
        run: |
          set -eux
          find objs -mindepth 1 -maxdepth 1 ! -name distribution -exec rm -rf {} +
          rm -rf /e/emu/external/grpc || true
          rm -rf /e/cc || true
          df -h /e

      - name: Pack zip
        working-directory: /e/emu/external/qemu/objs/distribution
        run: |
          set -eux
          zip -r /e/emulator-linux-aarch64.zip emulator
          # artifact 路径相对仓库根（与 /e 同一块盘）
          ln -sfn /e/emulator-linux-aarch64.zip \
            "${{ github.workspace }}/emulator-linux-aarch64.zip" || \
            cp -f /e/emulator-linux-aarch64.zip \
              "${{ github.workspace }}/emulator-linux-aarch64.zip"
          ls -lh /e/emulator-linux-aarch64.zip
          python3 - <<'PY'
          import os
          n = os.path.getsize("/e/emulator-linux-aarch64.zip")
          print("zip_bytes", n)
          assert n > 50_000_000, "zip too small, build incomplete"
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-linux-aarch64
          path: emulator-linux-aarch64.zip
          retention-days: 14
          if-no-files-found: error
